# Source -> Build -> Test -> Package -> Deploy (compose) -> Health Check -> Running  (brief §12)
name: CI

on:
  push:
    branches: [main, be-core, intel, web, ops]
  pull_request:

jobs:
  backend-test:
    name: Build & test backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt ruff
      - name: Lint (errors only)
        run: ruff check app --select E9,F63,F7,F82
      - name: Unit tests
        run: python -m pytest -q tests

  web-build:
    name: Build web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: has_web
        run: echo "present=$([ -f web/package.json ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.has_web.outputs.present == 'yes'
        with:
          node-version: "24"
      - name: Install & build
        if: steps.has_web.outputs.present == 'yes'
        working-directory: web
        run: (npm ci || npm install --no-audit --no-fund) && npm run build

  deploy-smoke:
    name: Package, deploy (compose) & health check
    runs-on: ubuntu-latest
    needs: backend-test
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build backend
      - name: Deploy stack
        run: docker compose up -d simulator-api backend prometheus
      - name: Health check
        run: |
          for i in $(seq 1 40); do
            if curl -fsS http://localhost:8090/api/health && curl -fsS http://localhost:8000/v1/health; then break; fi
            sleep 3
          done
          curl -fsS http://localhost:8090/api/system/status | tee status.json
          python3 -c "import json;s=json.load(open('status.json'));assert s['components']['simulator']=='healthy',s;print('overall:',s['overall'])"
      - name: End-to-end smoke (step simulator, expect recommendations)
        run: |
          curl -fsS -X POST -H "X-Operator-Key: change-me" -H "Content-Type: application/json" -d '{"n":30}' http://localhost:8090/api/sim/step
          sleep 5
          curl -fsS http://localhost:8090/api/state > /dev/null
          curl -fsS "http://localhost:8090/api/recommendations?status=all" | python3 -c "import json,sys;r=json.load(sys.stdin);print(len(r),'recommendations');assert len(r)>0"
          curl -fsS http://localhost:8090/metrics | grep -c gta7_
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v
