# GTA 7 platform: `docker compose up --build`   (scale reads: `docker compose up -d --scale api=3`)
#
#   gateway    http://localhost        (also :8090)  single entrypoint: console, API, /grafana/, /prometheus/
#   web        operator console (Next.js), behind the gateway
#   backend    the ENGINE: single writer (tick loop, approvals, mode, chaos, live stream)
#   api        stateless READ replicas (state, alerts, recommendations, what-if, status, AI assistant) - scalable
#   postgres   shared database (recommendations, decision audit, alerts, metrics, engine snapshot)
#   simulator  http://localhost:8000   (organizer image)
#   prometheus http://localhost/prometheus/  (also :9090)   grafana http://localhost/grafana/ (also :3001, admin/admin)
services:
  simulator-api:
    image: asifmahmoud414/bup-fuel-supply-simulator:1.0.0
    environment:
      SIMULATION_SPEED: ${SIMULATION_SPEED:-8}
      TICK_MINUTES: ${TICK_MINUTES:-15}
      SIMULATOR_START_MODE: ${SIMULATOR_START_MODE:-paused}
    ports:
      - "8000:8000"
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: gta7
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-gta7}
      POSTGRES_DB: gta7
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gta7 -d gta7"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:  # the engine (single writer)
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      ROLE: engine
      SIMULATOR_URL: http://simulator-api:8000
      DATABASE_URL: postgresql+psycopg://gta7:${POSTGRES_PASSWORD:-gta7}@postgres:5432/gta7
    depends_on:
      simulator-api:
        condition: service_started
      postgres:
        condition: service_healthy
    restart: unless-stopped

  api:  # stateless read replicas: scale with --scale api=N
    build: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      ROLE: api
      SIMULATOR_URL: http://simulator-api:8000
      DATABASE_URL: postgresql+psycopg://gta7:${POSTGRES_PASSWORD:-gta7}@postgres:5432/gta7
    deploy:
      replicas: ${API_REPLICAS:-2}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:  # same-origin through the gateway, so it works on any host (localhost, a VM, a tunnel)
        NEXT_PUBLIC_API_URL: /
        NEXT_PUBLIC_GRAFANA_URL: /grafana/
        NEXT_PUBLIC_PROMETHEUS_URL: /prometheus/
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  gateway:
    image: nginx:1.29-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
      - "8090:80"
    depends_on:
      - web
      - api
      - backend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/gateway/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1d
      - --web.external-url=/prometheus/
      - --web.route-prefix=/prometheus
    volumes:
      - ./ops/prometheus:/etc/prometheus:ro
    ports:
      - "9090:9090"
    depends_on:
      - backend
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    volumes:
      - ./ops/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pg-data:
