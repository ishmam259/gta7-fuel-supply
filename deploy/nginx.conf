# GTA7 gateway: one public entrypoint for the whole platform.
#   /                 -> operator console (Next.js)
#   /api/... (reads)  -> api replicas (stateless, horizontally scaled, round-robin)
#   /api/... (writes, control, live stream) -> the single engine (one writer: no duplicate decisions)
#   /grafana/         -> Grafana
#   /prometheus/      -> Prometheus
worker_processes auto;
events { worker_connections 4096; }

http {
  resolver 127.0.0.11 valid=10s ipv6=off;   # Docker DNS: `api` resolves to every replica

  upstream api_pool {
    zone api_pool 64k;
    server api:8090 resolve;                 # re-resolved every 10 s, so `--scale api=N` is picked up live
    keepalive 64;
  }
  # every upstream is re-resolved, so rebuilt/recreated containers (new IPs) are picked up without a gateway restart
  upstream engine { zone engine 64k; server backend:8090 resolve; keepalive 16; }
  upstream web { zone web 64k; server web:3000 resolve; keepalive 16; }
  upstream grafana_up { zone grafana_up 64k; server grafana:3000 resolve; }
  upstream prometheus_up { zone prometheus_up 64k; server prometheus:9090 resolve; }

  log_format gw '$remote_addr "$request" $status $request_time upstream=$upstream_addr';
  access_log /dev/stdout gw;

  map $http_upgrade $connection_upgrade { default upgrade; '' ""; }

  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  add_header X-GTA7-Upstream $upstream_addr always;

  server {
    listen 80;
    client_max_body_size 2m;

    location = /gateway/health { return 200 "ok\n"; }

    # ---- live stream (SSE) comes from the engine; never buffer it
    location = /api/stream {
      proxy_pass http://engine;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
    }

    # ---- writes / control: always the single engine
    location ~ ^/api/recommendations/[0-9]+/(approve|reject)$ { proxy_pass http://engine; }
    location ~ ^/api/(mode|sim/|chaos/|scenarios/.+/run|faults/|benchmark) { proxy_pass http://engine; }

    # ---- everything else under /api is a read: load-balanced across replicas
    location /api/ { proxy_pass http://api_pool; }
    location ~ ^/(docs|redoc|openapi.json) { proxy_pass http://api_pool; }

    location /grafana/ {
      proxy_pass http://grafana_up;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
    location /prometheus/ { proxy_pass http://prometheus_up; }

    location / { proxy_pass http://web; }
  }
}
